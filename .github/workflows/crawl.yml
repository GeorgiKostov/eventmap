name: Scheduled crawl

# Validation-phase policy: refresh Austria only. Known deterministic routes run
# daily at $0; known/unknown LLM routes run weekly through Gemini Flash-Lite
# with no Anthropic fallback and a hard request budget. Germany and Bulgaria
# stay published but are not refreshed until demand justifies reopening them.
#
# Setup + cost details: docs/ops/crawl-cron.md

on:
  schedule:
    # Daily deterministic refresh; source tiers still gate who is actually due.
    - cron: '0 4 * * *'
    # Weekly paid lane, offset so Sunday's deterministic run finishes first.
    - cron: '30 4 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Austria crawl lane'
        type: choice
        options:
          - structured
          - llm
        default: structured

concurrency:
  group: crawl
  cancel-in-progress: false # a running crawl is never killed; a new trigger queues

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # generous cap; a full pass is ~30–90 min, mostly hash-skips
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Secrets are passed as env vars (masked in logs, never written to disk),
      # so we call the script directly instead of the `--env-file=.env.local`
      # npm script, which has no .env.local in CI.
      - name: Run crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Crawl spend must fail closed. The newsletter workflow keeps its own
          # Anthropic key for Sonnet copy; this workflow never receives it.
          EXTRACT_FALLBACK: none
          MAX_LLM_CALLS: 150
          CRAWL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '30 4 * * 0' && 'llm' || 'structured' }}
        run: node scripts/crawl.mjs --country AT --mode "$CRAWL_MODE"
