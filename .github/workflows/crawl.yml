name: Scheduled crawl

# Zero paid AI policy: Austria-only deterministic refresh. AI extraction and
# summaries happen interactively in Codex under George's subscription.
# Setup: docs/ops/crawl-cron.md

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: crawl
  cancel-in-progress: false # a running crawl is never killed; a new trigger queues

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # generous cap; a full pass is ~30–90 min, mostly hash-skips
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Secrets are passed as env vars (masked in logs, never written to disk),
      # so we call the script directly instead of the `--env-file=.env.local`
      # npm script, which has no .env.local in CI.
      - name: Run crawl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/crawl.mjs --country AT --mode structured

      - name: Refresh SEO pages
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          NEXT_PUBLIC_BASE_URL: https://www.okolo.events
        run: node scripts/refresh-seo.mjs
