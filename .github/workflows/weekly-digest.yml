name: Weekly digest (prepare + send)

# Thursday's growth engine: prepare a fresh issue, then send it five hours later.
#
# This job freezes each city's weekend picks and uses deterministic template copy into
# the digest snapshot, then emails George that the desk is ready. At 14:00 UTC a
# separate job asks the deployed app to send each live Austrian edition to its
# explicitly assigned confirmed audience.
# That call fails closed unless the snapshot was freshly regenerated, has at
# least five picks, and every selected event is still eligible and unchanged.
# Social posting remains manual.
#
# Runs BEFORE the Thursday-afternoon post slot so the copy is waiting for him.

on:
  schedule:
    # Off the hour: on-the-hour schedules ran ~7h late (send at 21:14 UTC on 2026-11-12).
    - cron: '11 9 * * 4' # Thursday ~09:11 UTC (~10:11 Vienna)
    - cron: '11 14 * * 4' # Thursday ~14:11 UTC (15:11 CET)
  workflow_dispatch:

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '11 9 * * 4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prepare weekend digests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # The "picks ready" mail needs NOTIFY_TO plus one transport: RESEND_API_KEY
          # (same key as on Vercel) or SMTP_USER/SMTP_PASS. Without them the log
          # says "operator NOT notified" and the prepare still succeeds.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NEXT_PUBLIC_BASE_URL: https://okolo.events
        # NEWSLETTER_EDITIONS is the single launch registry. `--live` prepares
        # exactly those cities, not every paused BG/DE channel.
        # Scheduled runs always replace future/SEO snapshots with a fresh issue.
        run: node scripts/weekly-digest.mjs --live --notify --regenerate

  send:
    if: github.event_name == 'schedule' && github.event.schedule == '11 14 * * 4'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send the prepared live newsletters
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          NEXT_PUBLIC_BASE_URL: https://www.okolo.events
        run: node scripts/trigger-weekly-newsletter.mjs
